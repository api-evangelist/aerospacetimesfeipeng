aid: aerospacetimesfeipeng
name: Aerospace Times Feipeng
description: 'Aerospace Times Feipeng Co., Ltd. (航天时代飞鹏有限公司) is a Chinese unmanned transport
  aircraft manufacturer founded in 2020 in the Huaqiao Economic Development Zone of Kunshan, Jiangsu,
  as a mixed-ownership enterprise launched by the China Aerospace Science and Technology Corporation
  (CASC) together with SF Express. It designs, manufactures and operates cargo UAV systems across three
  payload/range classes — the Double 1000 (1000 kg / 1000 km trunk-line), Double 100 (branch-line) and
  Double 10 (last-mile) series — alongside special aircraft, ground control stations, an unmanned
  aircraft operation control system, and an AOPA-certified UAV pilot training centre. Its FP-98 "Leo"
  large fixed-wing UAV received a CAAC type certificate in April 2024. The company publishes a
  corporate marketing website in Chinese and English; it operates no public developer program and
  publishes no machine-readable API contract.'
